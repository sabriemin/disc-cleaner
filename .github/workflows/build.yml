name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to attach files to a release when a v* tag is pushed

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test DiskTemizleyici.sln -c Release

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/DiskTemizleyici.App -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -o publish/framework
          dotnet publish src/DiskTemizleyici.App -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -o publish/standalone
          Copy-Item publish/framework/DiskTemizleyici.exe DiskTemizleyici.exe
          Copy-Item publish/standalone/DiskTemizleyici.exe DiskTemizleyici-standalone.exe

      - uses: actions/upload-artifact@v4
        with:
          name: DiskTemizleyici
          path: DiskTemizleyici*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DiskTemizleyici*.exe
          generate_release_notes: true
