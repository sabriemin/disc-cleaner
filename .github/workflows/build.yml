name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to attach files to a release when a v* tag is pushed

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test DiskTemizleyici.sln -c Release

      # A v1.2.3 tag builds version 1.2.3. Any other build is labelled <csproj Version>-dev.<run number>,
      # so a test build can never be mistaken for a release.
      - name: Version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') {
              throw "Release tags must look like v1.2.3 (got '$env:REF_NAME')."
            }
            $version = $Matches[1]
          } else {
            $csproj = [xml](Get-Content src/DiskTemizleyici.App/DiskTemizleyici.App.csproj)
            $base = @($csproj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
            $version = "$base-dev.$env:RUN_NUMBER"
          }
          Write-Host "Building version $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish src/DiskTemizleyici.App -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -p:Version=$env:VERSION -o publish/framework
          dotnet publish src/DiskTemizleyici.App -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:Version=$env:VERSION -o publish/standalone
          Copy-Item publish/framework/DiskTemizleyici.exe DiskTemizleyici.exe
          Copy-Item publish/standalone/DiskTemizleyici.exe DiskTemizleyici-standalone.exe

      - uses: actions/upload-artifact@v7
        with:
          name: DiskTemizleyici
          path: DiskTemizleyici*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: DiskTemizleyici*.exe
          generate_release_notes: true
